<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <style>
    :root { --app-loading-bg: #fff; --app-loading-text: #171831; --app-loading-muted: #77658f; --app-loading-button: #792bff; --app-loading-button-text: #fff; }
    :root[data-theme="dark"] { --app-loading-bg: #130f1d; --app-loading-text: #f8f6ff; --app-loading-muted: #b7accb; --app-loading-button: #c7a7ff; --app-loading-button-text: #161122; }
    html.app-booting, html.app-booting body { background: var(--app-loading-bg); color: var(--app-loading-text); }
  </style>
  <script>
    // Apply the saved preference before the first paint and before the app bundle loads.
    (function () {
      var theme = 'light';
      try { if (localStorage.getItem('overview-theme') === 'dark') theme = 'dark'; } catch (_) {}
      document.documentElement.dataset.theme = theme;
      document.documentElement.classList.add('app-booting');
      document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#130f1d' : '#ffffff';
    })();
  </script>
  <meta name="description" content="ORBS PoS analytics - staking, delegations and rewards" />
  <link rel="icon" type="image/png" href="/favicon-gradient.png" />
  <link rel="manifest" href="/manifest.json" />
  <title>Orbs PoS Analytics</title>
  <script>
    // minimal node-global shims for legacy web3-era dependencies
    window.global = window;
    window.process = window.process || { env: {} };
  </script>
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // MIT License
    // https://github.com/rafgraph/spa-github-pages
    (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
      // if it's on index.html
      if (window.sessionStorage.path) {
        let path = window.sessionStorage.path; // gets the path saved on sessionStorage
        window.history.pushState(null, null, path); // push it on url
        window.sessionStorage.removeItem("path"); // removes from session
      } else {
        // if it's on 404.html (path doens't exist)
        let path = window.location.pathname; // get the path url
        window.sessionStorage.path = path; // saves on sessionStorage
        window.location.href = "/"; // go to index
      }
  </script>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
